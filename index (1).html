<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinco Noches de Spring</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/brython@3.15.0/brython.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/brython@3.15.0/brython_stdlib.js"></script>
<style>:root{--ink:#070909;--wall:#1a2420;--phos:#b7d9a8;--red:#c1121f;--amber:#e0a526}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--phos);font-family:'VT323','Courier New',monospace;font-size:20px;overflow:hidden}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--ink);user-select:none}
#world{position:absolute;top:0;left:-10%;width:120%;height:100%;transition:transform .15s linear}
#wall{position:absolute;inset:0 0 28% 0;background:linear-gradient(#202c27,#101714);border-bottom:10px solid #0a0f0d}
#hall{position:absolute;left:38%;width:24%;top:14%;height:48%;background:#000;border:8px solid #2b3a34;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
#dark{position:absolute;inset:0;background:#000;opacity:1;transition:opacity .06s}
#hall.lit #dark{opacity:.05}
#hall.lit{background:radial-gradient(#8a9a7a,#1a221c)}
#hallfig{display:none;position:relative;width:46%;height:80%}
#hallfig.show{display:block}
.fig{position:absolute;inset:0}
.fig .h{position:absolute;left:18%;top:0;width:64%;height:36%;background:#8b7a3a;border-radius:46% 46% 30% 30%}
.fig .h::before,.fig .h::after{content:"";position:absolute;top:38%;width:16%;height:22%;border-radius:50%;background:#000;box-shadow:0 0 0 3px #d8d0a0}
.fig .h::before{left:18%}.fig .h::after{right:18%}
.fig .b{position:absolute;left:10%;top:36%;width:80%;height:64%;background:#6d5f2a;border-radius:14px 14px 0 0}
.vent{position:absolute;top:30%;width:11%;height:20%;background:repeating-linear-gradient(0deg,#0c110f 0 8px,#33423b 8px 12px);border:6px solid #3b4d45}
#ventL{left:21%}#ventR{right:21%}
.vent.pulse{animation:vp .5s steps(2) 6}
@keyframes vp{50%{filter:brightness(2.5) sepia(1) hue-rotate(-30deg)}}
#fan{position:absolute;left:47%;bottom:30%;width:6%;aspect-ratio:1;border-radius:50%;border:5px solid #2b3a34;background:#0b100e}
#fan i{position:absolute;left:46%;top:6%;width:8%;height:88%;background:#46564e;animation:spin .25s linear infinite}
#fan i:nth-child(2){transform:rotate(90deg);animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
#fan{animation:spin .3s linear infinite}
#desk{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(#2c2218,#120d08);border-top:8px solid #4b3a29}
#resetBtn{position:absolute;left:18%;bottom:6%;width:15%;height:14%;background:#2a2a2a;color:#777;border:4px solid #555;font:inherit;cursor:pointer;display:none}
#resetBtn.need{display:block;color:#fff;border-color:var(--red);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{background:#5a0a10}}
#resetBar{position:absolute;left:0;bottom:0;height:8px;background:var(--amber);width:0}
#noise{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.07;pointer-events:none;mix-blend-mode:screen}
#crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0006 0 2px,transparent 2px 4px),radial-gradient(ellipse,transparent 55%,#000c 100%);animation:flick .12s steps(2) infinite}
@keyframes flick{50%{opacity:.93}}
#game.glitch #world{animation:gl .15s steps(3)}
@keyframes gl{0%{transform:translate(-14px,3px);filter:hue-rotate(90deg)}50%{transform:translate(12px,-4px);filter:invert(.3)}100%{transform:translate(0)}}
#hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;text-shadow:0 0 6px var(--phos);pointer-events:none}
#batt{display:inline-block;width:110px;height:12px;border:2px solid var(--phos);vertical-align:middle}
#battIn{display:block;height:100%;background:var(--phos)}
#msg{position:absolute;top:42px;width:100%;text-align:center;color:var(--amber)}
#camBtn{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:42%;padding:8px;font:inherit;background:#0b100e;color:var(--phos);border:3px solid #3b4d45;cursor:pointer;z-index:4}
#mask{position:absolute;inset:0;display:none;z-index:3;background:radial-gradient(ellipse at 50% 55%,transparent 0 22%,#c8441e 23% 30%,#b3361a 31%);border:0}
#mask.on{display:block}
#mask::before,#mask::after{content:"";position:absolute;top:32%;width:14%;height:16%;background:#050505;border-radius:50%;box-shadow:inset 0 0 0 6px #1a1a1a}
#mask::before{left:30%}#mask::after{right:30%}
#monitor{position:absolute;inset:3% 8% 14%;background:#070b09;border:6px solid #3b4d45;display:none;z-index:2}
#monitor.on{display:block}
#monitor svg{width:100%;height:100%}
.room rect{fill:#0e1713;stroke:var(--phos);stroke-width:2;cursor:pointer}
.room:hover rect{fill:#1c2d24}.room.ping rect{fill:#2e5a3d}
.room text,.lbl{fill:var(--phos);font-size:15px;pointer-events:none}
.mk{fill:var(--red);font-size:26px}
#monitor::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0005 0 2px,transparent 2px 4px);pointer-events:none}
#screen,#scare{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:#000e;padding:24px}
#screen h1{font-size:3rem;margin:0;color:var(--amber)}#screen p{max-width:640px;margin:0;line-height:1.3}
#screen button{font:inherit;font-size:1.5rem;padding:8px 24px;background:#1a2420;color:var(--phos);border:3px solid var(--phos);cursor:pointer}
#scare{display:none;background:#400;animation:sh .06s infinite}
#scare .fig{position:relative;width:60vmin;height:70vmin}
@keyframes sh{0%{transform:translate(-14px,9px) scale(1.04)}100%{transform:translate(12px,-10px) scale(1.1)}}
@media (prefers-reduced-motion:reduce){#scare,#crt,#fan{animation:none}}
.ctl{font:inherit;font-size:17px;background:#0b100e;color:var(--phos);border:3px solid #3b4d45;padding:4px 10px;cursor:pointer;text-align:left}
.ctl.on{background:var(--amber);color:#000}
#left,#right{position:absolute;bottom:10px;display:flex;flex-direction:column;gap:5px;z-index:5}#left{left:10px}#right{right:10px}
.door{position:absolute;top:22%;width:8%;height:46%;border:6px solid #3b4d45;background:#050707;overflow:hidden}
#dL{left:9%}#dR{right:9%}.door.lit{background:#9fae85}
.dsp{display:none;position:absolute;left:0;right:0;bottom:0}.door.seen .dsp{display:block}#hallfig svg{width:100%}#faces{pointer-events:none}#scare svg{filter:contrast(1.3)}
.door .slab{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#3d4a45 0 12px,#2a3430 12px 14px);transform:translateY(-100%);transition:transform .2s}
.door.closed .slab{transform:none}
#maskInfo{position:absolute;left:50%;top:58%;transform:translateX(-50%);z-index:4;display:none;color:#fff;text-align:center;background:#000b;padding:6px 14px;border:2px solid var(--red)}
#scare.puppet .h{background:#e8e8e8}
#screen{overflow-y:auto;justify-content:safe center}.tut{text-align:left;max-width:720px;font-size:18px;line-height:1.25}.tut b{color:var(--amber)}
:root{--ink:#060a12;--phos:#c9f0e4;--red:#ff2e4d;--amber:#ffc24a;--teal:#12303d}
body{background:#03060b}#game{background:#060a12}
#wall{background:linear-gradient(#0b1d33,#0d3140 62%,#07121c);border-bottom-color:#04080d}
#world::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 28%,#ffc24a26,transparent 48%),radial-gradient(ellipse at 15% 85%,#3dff8a1c,transparent 40%),radial-gradient(ellipse at 85% 85%,#ff2e4d18,transparent 40%)}
#hall{border-color:#1c5568;box-shadow:0 0 50px #ffc24a44}
.vent,.door{border-color:#1f5a6c}
#desk{background:linear-gradient(#1b1511,#080605);border-top-color:#3a2d22;box-shadow:0 -10px 40px #ffc24a22}
#hud{color:#3dff8a;text-shadow:0 0 8px #3dff8a}
#neon{position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:1;padding:4px 26px;font-size:1.7rem;color:#ff2e4d;text-shadow:0 0 12px #ff2e4d;background:#14060a;border:5px solid #3dff8a;border-radius:50px;box-shadow:0 0 18px #3dff8a,inset 0 0 14px #ff2e4d55;animation:neon 4s steps(1) infinite}
@keyframes neon{91%{opacity:.35}93%{opacity:1}96%{opacity:.5}}
#noise,#crt{z-index:3}#msg{z-index:6}
#screen{background:radial-gradient(ellipse at 50% 90%,#1d6a5466,transparent 55%),linear-gradient(#0a1a33,#04080f)}
#screen h1{color:#ff2e4d;border:5px solid #3dff8a;border-radius:60px;padding:4px 32px;text-shadow:0 0 14px #ff2e4d;box-shadow:0 0 20px #3dff8a,inset 0 0 14px #ff2e4d55;background:#12060a}
#screen button{border-color:#3dff8a;background:#0b2230;color:#c9f0e4}
.tag{letter-spacing:.4em;color:#9fd8ff;margin:0}
.sil{display:flex;gap:14px;filter:brightness(.22) drop-shadow(0 0 10px #ffc24a99)}
#camBtn{background:#1a1a1a;border-color:#ddd;color:#ddd}
#monitor{inset:0;border:0;background:#1c1c1b}
#feed{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:2%;padding-bottom:8%;background:radial-gradient(ellipse at 50% 38%,#8b8b86,#2b2b29 68%,#0a0a09);filter:grayscale(1) contrast(1.25) blur(.4px)}
#feed svg{width:24%;height:auto;filter:drop-shadow(0 0 14px #000)}
#monitor::before{content:"";position:absolute;left:0;right:0;height:16%;z-index:1;pointer-events:none;background:linear-gradient(#fff0,#ffffff1c,#fff0);animation:roll 4s linear infinite}
@keyframes roll{from{top:-18%}to{top:100%}}
#monitor>*:not(#feed){z-index:2}
#rec{position:absolute;top:14px;left:16px;width:22px;height:22px;border-radius:50%;background:#e0152b;box-shadow:0 0 10px #e0152b;animation:rec 1s steps(1) infinite}
@keyframes rec{50%{opacity:.15}}
#mClock{position:absolute;top:10px;right:14px;text-align:right;color:#fff;font-size:1.5rem;line-height:1}
#camlabel{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);color:#fff;font-size:1.6rem;text-shadow:0 0 6px #000}
#mPow{position:absolute;top:44px;left:14px;color:#fff;text-shadow:0 0 4px #000}
#lureBtn{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);background:#1a1a1a;border:3px solid #ddd;color:#fff;padding:5px 16px;font:inherit;cursor:pointer}
#monitor #map{position:absolute;top:56px;right:12px;width:30%;height:auto;background:#161616cc;border:3px solid #ddd}
.room rect{fill:#2c2c2c;stroke:#ddd}.room.sel rect{fill:#5b8f5b}.room text,.lbl{fill:#eee}
@media (prefers-reduced-motion:reduce){#neon,#rec,#monitor::before{animation:none}}

body{background:#010201}
#game{border:16px solid #0b0c0a;border-radius:36px;box-shadow:inset 0 0 90px #000,inset 0 0 0 3px #1e211b,0 0 40px #000}

#hall{border-color:#2b3326;box-shadow:0 0 40px #9fb08a22}
.vent,.door{border-color:#2b3326}

#hud{color:#a9b79a;text-shadow:0 0 6px #a9b79a66;right:78px}

.wp,.poster{background:radial-gradient(circle at 70% 60%,#4c7a3a77,transparent 45%),#c9a96a;color:#2a2013}
.wp{position:absolute;top:8%;width:6%;padding:4px;font-size:.7rem;text-align:center;transform:rotate(-3deg);z-index:1;opacity:.85;box-shadow:0 4px 12px #000}
.wp i,.poster i{display:block;height:3px;background:#2a2013;margin:3px 0;opacity:.6}
.wl{left:23%}.wr{right:23%;transform:rotate(4deg)}
#crt{background:repeating-linear-gradient(0deg,#0007 0 2px,transparent 2px 4px),radial-gradient(ellipse,transparent 38%,#000e 100%)}
button{background:#14170f;border-color:#4a5240;color:#a9b79a}
#camBtn,#lureBtn{background:#14170f;border-color:#6b7560;color:#c4cdb6}
#screen{background:radial-gradient(ellipse at 50% 40%,#1d241c,#040504 78%)}
#screen h1,#pause h1{color:#c9a96a;border:0;border-radius:0;padding:0;background:none;box-shadow:none;letter-spacing:.06em;text-shadow:0 0 12px #c9a96a55}
#screen button,#pause button{border-color:#6b7560;background:#12150e;color:#c4cdb6;font:inherit;font-size:1.5rem;padding:8px 24px;cursor:pointer}
#pause{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000d}
#pauseBtn{position:absolute;top:8px;right:12px;z-index:7;padding:2px 10px;font-size:20px;line-height:1.2}
#mClock{right:100px}
.tag{color:#8d9a74}
.eyes{display:flex;gap:46px}.eyes i{width:12px;height:12px;border-radius:50%;background:#ff2a2a;box-shadow:0 0 14px 4px #ff2a2a99;animation:blink 5s steps(1) infinite}

.posters{display:flex;gap:10px;margin-top:8px}

/* ---- Oficina verde limón semitransparente + parpadeo de luz */
#world::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:rgba(190,255,50,.22);mix-blend-mode:color;animation:lamp 7s infinite}
@keyframes lamp{0%,100%{opacity:1}7%{opacity:.5}9%{opacity:1}52%{opacity:.78}54%{opacity:1}81%{opacity:.35}83%{opacity:1}}
/* ---- Aberración cromática y glitches */
@keyframes gl{0%{transform:translate(-14px,3px);filter:hue-rotate(90deg) drop-shadow(6px 0 #f00a) drop-shadow(-6px 0 #0ffa)}50%{transform:translate(12px,-4px);filter:invert(.3) drop-shadow(-5px 0 #f00a) drop-shadow(5px 0 #0ffa)}100%{transform:translate(0)}}
#world{filter:drop-shadow(1.5px 0 rgba(255,0,60,.35)) drop-shadow(-1.5px 0 rgba(0,255,255,.35))}
#feed.glitch{animation:camglitch .35s steps(4)}
@keyframes camglitch{0%{transform:translateX(-14px);clip-path:inset(12% 0 62% 0);filter:grayscale(1) contrast(1.8) drop-shadow(7px 0 #f00) drop-shadow(-7px 0 #0ff)}25%{transform:translateX(12px);clip-path:inset(58% 0 16% 0)}50%{transform:translateX(-6px);clip-path:inset(0)}75%{transform:translateX(5px);filter:grayscale(1) contrast(2) brightness(1.6)}100%{transform:none;clip-path:inset(0)}}
#feed svg{filter:drop-shadow(2px 0 rgba(255,0,0,.55)) drop-shadow(-2px 0 rgba(0,255,255,.55)) drop-shadow(0 0 14px #000)}
/* ---- Fondos pixel art y marcos de entrada en cámaras */
#feed svg.bg{position:absolute;inset:0;width:100%;height:100%;filter:none;image-rendering:pixelated}
#feed .occ{position:relative;display:flex;gap:2%;align-items:flex-end;justify-content:center;width:100%}
#feed .occ.f-hall{position:absolute;left:35%;width:30%;bottom:31%}
#feed .occ.f-vent{position:absolute;left:31%;width:38%;bottom:24%}
#feed .occ.f-hall svg,#feed .occ.f-vent svg{width:70%}
#mapToggle{position:absolute;top:52px;right:12px;padding:3px 10px;font-size:16px}
#monitor #map{top:88px}
/* ---- Máscara */
#mask{background:none;border:0}#mask::before,#mask::after{display:none}
#mask svg{width:100%;height:100%;display:block}#mask.on svg{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.035)}}
/* ---- Victoria */
.win6{font-size:min(22vw,9rem);color:#c9a96a;text-shadow:0 0 30px #c9a96a;animation:pulse 1.4s ease-in-out infinite}
#screen h1.big{font-size:min(7vw,3.2rem);animation:pulse 1.4s ease-in-out infinite;color:#ffe9a8}
@keyframes pulse{50%{transform:scale(1.06);filter:brightness(1.4)}}
@media (max-width:900px),(max-height:560px){#mapToggle{top:36px;font-size:13px;padding:2px 8px}#monitor #map{top:66px}}
@media (prefers-reduced-motion:reduce){#world::after,#feed.glitch,.win6,#screen h1.big,#mask.on svg{animation:none}}

<script type="text/python" id="engine">
"""Lógica del juego en el servidor: IA con d20, reloj, energía, audio, caja de música y ventilación."""
import math, random

ADJ = {'R1': ['R2'], 'R2': ['R1', 'R3'], 'R3': ['R2', 'R4', 'HALL'], 'R4': ['R3', 'HALL'], 'HALL': ['R3', 'R4']}
DIST = {'R1': 3, 'R2': 2, 'R3': 1, 'R4': 1, 'HALL': 0}
ROOM, HALL, DOOR = 1, 2, 3                    # estados de Springtrap
AWAY, CRAWL, LAUGH, INSIDE = 1, 2, 3, 4       # estados de Balloon Boy
pick, rnd = random.choice, random.uniform

LV = {  # hour = segundos reales por hora de juego; T = segundos entre chequeos; ai = nivel 0-20 (inicio, fin)
 'easy': dict(hour=50, ai=dict(freddy=(1, 4), chica=(2, 5), spring=(3, 6)), T=dict(freddy=6, chica=5, spring=5.5), music=.7, warn=20, warnVol=.08, grace=12, save=30, power=.55, doorT=5, balloon=(16, 26), bots=['bonnie'], sHall=12, sReact=2, warnLead=1.5, sigP=1, sigVol=.3, blind=0, alt=0, skip=0, lureEff=1, lureNear=1, fail=.2, fixT=3, lureCd=8, gap=15, boost=0),
 'mid': dict(hour=65, ai=dict(freddy=(3, 8), chica=(4, 9), spring=(5, 10)), T=dict(freddy=5, chica=4.5, spring=4.5), music=1.5, warn=50, warnVol=.1, grace=8, save=40, power=.8, doorT=4, balloon=(12, 20), bots=['bonnie', 'chica'], sHall=9, sReact=1.2, warnLead=0, sigP=.5, sigVol=.12, blind=.25, alt=.4, skip=0, lureEff=.8, lureNear=.8, fail=.3, fixT=4, lureCd=12, gap=12, boost=0),
 'hard': dict(hour=80, ai=dict(freddy=(6, 14), chica=(7, 15), spring=(8, 16)), T=dict(freddy=4, chica=4, spring=3.5), music=4.5, warn=30, warnVol=.02, grace=1.5, save=50, power=1, doorT=3, balloon=(9, 15), bots=['bonnie', 'chica', 'freddy'], sHall=6, sReact=.7, warnLead=0, sigP=.2, sigVol=.04, blind=.4, alt=.3, skip=.3, lureEff=.7, lureNear=.4, fail=.35, fixT=5, lureCd=18, gap=8, boost=1)}
BOT = {'bonnie': dict(path=['R1', 'R2', 'R3'], door='L', slow=1), 'chica': dict(path=['R1', 'R2', 'R3', 'R4'], door='R', slow=1.1),
       'freddy': dict(path=['R1', 'R2', 'R3', 'R4'], door=None, slow=1.5)}
VENT = {'L': [(200, 40), (60, 40), (60, 178)]}            # conducto izquierdo (coordenadas del mapa 400x260)
VENT['R'] = [(400 - x, y) for x, y in VENT['L']]          # conducto derecho (espejo)


class Game:
    def __init__(self, level='easy'):
        self.D = D = LV.get(level, LV['easy'])
        self.bots = [dict(id=i, **BOT[i], idx=0, acc=0.0, roll=None, at=False, dt=0.0) for i in D['bots']]
        self.t = 0.0; self.ticks = 0; self.paused = False
        self.inp, self.once = {}, {}
        self.power = 100.0; self.door = {'L': False, 'R': False}; self.dl = None; self.pw_out = False
        self.music = 100.0; self.pup = 0; self.pup_t = 0.0; self.warned = False
        self.sp, self.pos, self.hall_t = ROOM, 'R1', 0.0
        self.spo = dict(acc=0.0, roll=None, sig=0, next=None)
        self.dside, self.door_t, self.last_hall, self.hide_until, self.boost_until, self.lure_cd = None, 0.0, -99, 0.0, 0.0, 0.0
        self.bl, self.side, self.b_timer, self.b_total, self.laughed2 = AWAY, None, rnd(*D['balloon']), 1.0, False
        self.speed, self.light_off = 1.0, False
        self.batt, self.fail_until, self.broken, self.reset_p = 100.0, 0.0, False, 0.0
        self.status, self.by = 'play', None
        self.mask_t = self.mask_cd = self.mask_h = self.flash_t = 0.0; self.masked = False
        self.seal = {'L': 0.0, 'R': 0.0}; self.seal_cd = {'L': 0.0, 'R': 0.0}

    # ---- entradas del cliente (persistentes y de un solo uso)
    def set_input(self, d):
        for k in ('light', 'mask', 'reset', 'monitor', 'wind'):
            self.inp[k] = bool(d.get(k))
        self.inp['dlight'] = d.get('dlight') if d.get('dlight') in ('L', 'R') else None
        for k in ('lure', 'tdoor', 'seal'):
            if d.get(k): self.once[k] = d[k]

    def take(self):
        i = {**self.inp, **self.once}; self.once = {}; return i

    # ---- utilidades
    def hour(self): return int(self.t // self.D['hour'])
    def blind(self): return self.light_off or self.t < self.fail_until
    def ai(self, k):
        a, b = self.D['ai'][k]; f = max(0, min(1, (self.hour() - 1) / 4))
        return round(a + (b - a) * f) + (1 if k == 'spring' and self.t < self.boost_until else 0)

    def go(self, room, ev):
        self.pos, self.hall_t = room, 0.0
        self.sp = HALL if room == 'HALL' else ROOM
        if self.sp == HALL:
            self.last_hall = self.t; ev.append({'type': 'steps'})

    def step(self, o, T, ai, dt, lead):
        """Chequeo de movimiento: cada T segundos se tira un d20; si sale <= ai, se mueve."""
        o['acc'] += dt * self.speed
        if o['roll'] is None and o['acc'] >= T - lead:
            o['roll'] = random.randint(1, 20) <= ai
        if o['acc'] >= T:
            r = o['roll']; o['acc'] = 0.0; o['roll'] = None; return bool(r)
        return False

    def sig(self, ev, room): ev.append({'type': 'sig', 'vol': self.D['sigVol'], 'room': room})

    # ---- paso del game loop (lo llama el servidor ~10 veces por segundo)
    def tick(self, inp, dt):
        D, ev = self.D, []
        if self.status != 'play': return self.view(False, ev, False)
        self.t += dt; self.ticks += 1
        self.mask_cd = max(0, self.mask_cd - dt); self.lure_cd = max(0, self.lure_cd - dt)
        mask = bool(inp.get('mask')) and self.mask_cd <= 0
        if mask:
            self.mask_t += dt
            if self.mask_t > 6: mask, self.mask_cd, self.mask_t = False, 5, 0; ev.append({'type': 'mask_out'})
        else: self.mask_t = 0
        for s in 'LR':
            self.seal[s] = max(0, self.seal[s] - dt); self.seal_cd[s] = max(0, self.seal_cd[s] - dt)
            if inp.get('seal') == s and self.seal[s] <= 0 and self.seal_cd[s] <= 0:
                self.seal[s], self.seal_cd[s] = 4, 12; ev.append({'type': 'sealed', 'side': s})
        monitor, room = bool(inp.get('monitor')) and not mask, inp.get('lure')
        if room in DIST and room != 'HALL' and monitor and not self.broken and self.lure_cd <= 0:
            self.lure_cd = D['lureCd']
            if room in ADJ[self.pos] and room != self.pos:        # audio: solo atrae desde una sala adyacente
                near = self.pos in ('R3', 'R4', 'HALL')
                if random.random() < (D['lureNear'] if near else D['lureEff']):
                    self.go(room, ev); self.spo.update(acc=0.0, roll=None)
                    if D['boost']: self.boost_until = self.t + 15
                    ev.append({'type': 'lure_ok'})
                else: ev.append({'type': 'lure_ignored'})
            if random.random() < D['fail']:                        # fallo del sistema de audio
                self.broken, self.reset_p = True, 0.0; ev.append({'type': 'lure_broke'})
        if self.broken:
            self.reset_p = self.reset_p + dt if inp.get('reset') else 0.0
            if self.reset_p >= D['fixT']: self.broken, self.reset_p = False, 0.0; ev.append({'type': 'lure_fixed'})
        light = bool(inp.get('light')) and not mask and not self.blind() and self.batt > 0
        self.batt = max(0, self.batt - 12 * dt) if light else min(100, self.batt + 6 * dt)
        if light and self.batt <= 0:
            self.fail_until = self.t + 4; light = False; ev.append({'type': 'light_fail'})
        self.masked = mask                                         # la máscara mitiga el ataque
        if light and self.sp == HALL:
            self.flash_t += dt
            if self.flash_t >= 2: self.flash_t = 0; self.go(pick(ADJ['HALL']), ev); ev.append({'type': 'flash'})
        else: self.flash_t = 0
        if mask and self.sp == HALL:
            self.mask_h += dt
            if self.mask_h >= 2: self.mask_h = 0; self.go(pick(ADJ['HALL']), ev); ev.append({'type': 'mask_scare'})
        else: self.mask_h = 0
        self.upd_doors(inp, dt, ev); self.upd_puppet(inp, dt, ev); self.upd_bots(dt, ev, monitor)
        self.upd_spring(dt, ev); self.upd_balloon(dt, mask, ev)
        if self.t >= D['hour'] * 6 and self.status == 'play': self.status = 'won'   # 6 AM
        return self.view(light, ev, monitor)

    def upd_doors(self, inp, dt, ev):
        if inp.get('tdoor') in ('L', 'R') and self.power > 0: self.door[inp['tdoor']] = not self.door[inp['tdoor']]
        self.dl = inp.get('dlight') if self.power > 0 else None
        use = .12 + (.9 if self.door['L'] else 0) + (.9 if self.door['R'] else 0) + (.6 if self.dl else 0)
        self.power = max(0, self.power - use * self.D['power'] * dt)
        if self.power <= 0 and not self.pw_out:
            self.pw_out = True; self.door = {'L': False, 'R': False}; ev.append({'type': 'power_out'})

    def upd_bots(self, dt, ev, monitor):
        for b in self.bots:
            if b['at']:
                if self.door[b['door']]:
                    b.update(at=False, idx=len(b['path']) - 2, acc=0.0, roll=None); ev.append({'type': 'knock'})
                else:
                    b['dt'] -= dt
                    if b['dt'] <= 0: self.status, self.by = 'dead', b['id']
            elif not (b['id'] == 'freddy' and monitor):        # Freddy solo avanza si no miras las cámaras
                k = 'freddy' if b['id'] == 'freddy' else 'chica'
                if self.step(b, self.D['T'][k] * b['slow'], self.ai(k), dt, 0):
                    b['idx'] += 1; ev.append({'type': 'moved'})
                    if b['idx'] >= len(b['path']):
                        b['at'], b['dt'] = True, self.D['doorT']
                        if b['id'] == 'freddy': b['door'] = pick('LR')
                        ev.append({'type': 'steps'})

    def at_door(self):
        o = {'L': None, 'R': None}
        for b in self.bots:
            if b['at']: o[b['door']] = b['id']
        if self.sp == DOOR: o[self.dside] = 'spring'
        return o

    def pup_pos(self):
        if not self.pup: return 'R1'
        return ['R1', 'R2', 'R3', 'R4'][min(3, int((1 - self.pup_t / self.D['grace']) * 4))]

    def cams(self, monitor):
        if not monitor: return {}
        c = {}
        def add(r, i): c.setdefault(r, []).append(i)
        if self.pos != 'HALL' and self.t >= self.hide_until: add(self.pos, 'spring')
        for b in self.bots:
            if not b['at']: add(b['path'][b['idx']], b['id'])
        add(self.pup_pos(), 'puppet')
        for i in self.at_door().values():                      # quien llega a la entrada aparece en el marco del Pasillo
            if i: add('HALL', i)
        if self.sp == HALL: add('HALL', 'spring')
        return c

    def upd_puppet(self, inp, dt, ev):
        D = self.D
        self.music = min(100, self.music + 18 * dt) if inp.get('wind') else max(0, self.music - D['music'] * (1 + self.hour() * .08) * dt)
        if self.pup == 0 and self.music <= D['warn'] and not self.warned:
            self.warned = True; ev.append({'type': 'music_warn', 'vol': D['warnVol']})
        if self.music > D['warn'] + 15: self.warned = False
        if self.pup == 0:
            if self.music <= 0: self.pup, self.pup_t = 1, D['grace']; ev.append({'type': 'puppet_out'})
        else:
            self.pup_t -= dt
            if self.music >= D['save']: self.pup = 0; ev.append({'type': 'puppet_back'})
            elif self.pup_t <= 0: self.status, self.by = 'dead', 'puppet'

    def next_room(self):
        lower = [x for x in ADJ[self.pos] if DIST[x] < DIST[self.pos]]
        return pick(ADJ[self.pos]) if random.random() < self.D['alt'] else pick(lower)

    def upd_spring(self, dt, ev):
        D, o = self.D, self.spo
        if self.sp == ROOM:
            if self.step(o, D['T']['spring'], self.ai('spring'), dt, D['warnLead']):
                n = o['next'] or self.next_room(); o['next'] = None; o['sig'] = 0
                if n == 'HALL' and (self.t < 90 or self.t - self.last_hall < D['gap']): return
                if n != 'HALL' and random.random() < D['skip']:
                    low = [x for x in ADJ[n] if DIST[x] < DIST[n]]
                    if low: n = pick(low)
                if random.random() < D['blind']: self.hide_until = self.t + 6
                if not D['warnLead'] and random.random() < D['sigP']: self.sig(ev, n)
                self.go(n, ev); ev.append({'type': 'moved'})
            elif o['roll'] and D['warnLead'] and not o['sig']:
                o['sig'] = 1; o['next'] = self.next_room(); self.sig(ev, o['next'])
        elif self.sp == DOOR:
            if self.door[self.dside]: self.go('HALL', ev); self.hall_t = D['sHall'] * .4; ev.append({'type': 'knock'})
            else:
                self.door_t -= dt * self.speed
                if self.door_t <= 0: self.status, self.by = 'dead', 'spring'
        else:
            self.hall_t += 0 if self.masked else dt * self.speed * (2 if self.blind() else 1)
            if self.hall_t >= D['sHall']:
                self.sp, self.dside, self.door_t = DOOR, pick('LR'), D['sReact']; ev.append({'type': 'steps'})

    def upd_balloon(self, dt, mask, ev):
        if self.bl == INSIDE: return
        self.b_timer -= dt
        if self.bl == AWAY and self.b_timer <= 0:
            self.bl, self.side = CRAWL, pick('LR'); self.b_total = self.b_timer = rnd(8, 12)
        elif self.bl == CRAWL and self.b_timer <= 0:
            self.bl, self.b_timer, self.laughed2 = LAUGH, 3.0, False; ev.append({'type': 'laugh', 'side': self.side})
        elif self.bl == LAUGH:
            if self.b_timer <= 1.5 and not self.laughed2:
                self.laughed2 = True; ev.append({'type': 'laugh', 'side': self.side})
            if self.b_timer <= 0:
                if mask or self.seal[self.side] > 0:
                    self.bl, self.b_timer = AWAY, rnd(18, 25); ev.append({'type': 'balloon_gone'})
                else:
                    self.bl, self.light_off, self.speed = INSIDE, True, 1.6; ev.append({'type': 'balloon_in'})

    def balloon_view(self):
        """Coordenadas exactas de Balloon Boy sobre el mapa de ventilación."""
        if self.bl == AWAY: return {'x': 200, 'y': 40, 'side': None, 'mode': 'away', 'f': 0}
        pts = VENT[self.side]; mode = {CRAWL: 'crawl', LAUGH: 'laugh', INSIDE: 'inside'}[self.bl]
        f = max(0.0, min(1.0, 1 - self.b_timer / self.b_total)) if self.bl == CRAWL else 1.0
        segs = list(zip(pts, pts[1:])); lens = [math.hypot(a[0] - b[0], a[1] - b[1]) for a, b in segs]; d = f * sum(lens)
        for n, ((a, b), l) in enumerate(zip(segs, lens)):
            if d <= l or n == len(segs) - 1:
                t = min(1.0, d / l)
                return {'x': round(a[0] + (b[0] - a[0]) * t, 1), 'y': round(a[1] + (b[1] - a[1]) * t, 1), 'side': self.side, 'mode': mode, 'f': round(f, 2)}
            d -= l

    def view(self, light, ev, monitor):
        ad = self.at_door()
        return dict(status=self.status, by=self.by, t=round(self.t, 1), hour=self.hour(), hourLen=self.D['hour'], ticks=self.ticks,
            masked=self.masked, door=self.door, power=round(self.power), music=round(self.music), pup=self.pup,
            dseen={'L': self.dl == 'L' and bool(ad['L']), 'R': self.dl == 'R' and bool(ad['R'])}, atDoor=ad,
            info={'sp': 'hall' if self.sp == HALL else 'door' + self.dside if self.sp == DOOR else 'far', 'bl': self.side if self.bl == LAUGH else None},
            maskCd=self.mask_cd, seal=self.seal, sealCd=self.seal_cd, spPos=self.pos, lureCd=self.lure_cd, batt=round(self.batt), light=light,
            blind=self.blind(), broken=self.broken, reset_p=self.reset_p / self.D['fixT'], hall=light and self.sp == HALL,
            cams=self.cams(monitor), balloon=self.balloon_view(), events=ev)

import json
from browser import window, timer

G = None        # partida actual
_last = 0.0


def _now():
    return window.performance.now() / 1000.0


def _loop():
    """Se ejecuta 10 veces por segundo (timer creado desde Python). Calcula todo y publica el estado."""
    global _last
    now = _now(); dt = min(now - _last, 0.5); _last = now
    if G is None or G.paused or G.status != 'play':
        return
    state = G.tick(G.take(), dt)
    window.onState(json.dumps(state))       # el frontend lee este estado y pinta la interfaz
    if G.status == 'won':                   # el reloj llegó a las 6 AM
        window.onVictory()


def start(level):
    global G, _last
    G = Game(level if level in LV else 'easy'); _last = _now()

def set_input(raw):                          # entradas del jugador: máscara, linterna, puertas, audio...
    if G is not None:
        G.set_input(json.loads(raw))

def pause(on):
    if G is not None:
        G.paused = bool(on)

def quit_game():
    global G
    G = None

window.py_start, window.py_set_input, window.py_pause, window.py_quit = start, set_input, pause, quit_game
timer.set_interval(_loop, 100)
window.py_ready = True

const fx=$('fx'),fc=fx.getContext('2d'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let P=[],fxUntil=0,fxCount=0,fxAlpha=0,fxCont=false,fxLast=performance.now(),lastBurst=0,nextRoll=0,staticUntil=0;
function fxResize(){fx.width=innerWidth;fx.height=innerHeight}fxResize();addEventListener('resize',fxResize);
function fxBurst(sec,n,a){if(RM)return;fxUntil=performance.now()+sec*1000;fxCount=n;fxAlpha=a;lastBurst=performance.now()}
function fxSpawn(){const big=Math.random()<.1;P.push({x:Math.random()*fx.width,y:-40,vy:big?70+Math.random()*40:45+Math.random()*70,vx:(Math.random()-.5)*30,r:big?24+Math.random()*18:3+Math.random()*4,a:Math.random()*6,big,c:['#c9a96a','#b3261e','#4f7a6a','#d8c060'][Math.random()*4|0]})}
function fxLoop(now){const dt=Math.min((now-fxLast)/1000,.1);fxLast=now;fc.clearRect(0,0,fx.width,fx.height);
  if(!paused){if((fxCont||now<fxUntil)&&P.length<fxCount)for(let i=0;i<2;i++)fxSpawn();
    P=P.filter(p=>p.y<fx.height+60);for(const p of P){p.y+=p.vy*dt;p.x+=(Math.sin(p.y/60+p.a)*20+p.vx)*dt;p.a+=dt*3}}
  fc.globalAlpha=fxAlpha;
  for(const p of P){fc.fillStyle=p.c;fc.strokeStyle=p.c;
    if(p.big){fc.beginPath();fc.ellipse(p.x,p.y,p.r,p.r*1.25,0,0,7);fc.fill();fc.beginPath();fc.moveTo(p.x,p.y+p.r*1.25);fc.lineTo(p.x+Math.sin(p.a)*6,p.y+p.r*3);fc.stroke()}
    else{fc.save();fc.translate(p.x,p.y);fc.rotate(p.a);fc.fillRect(-p.r,-p.r/2,p.r*2,p.r);fc.restore()}}
  requestAnimationFrame(fxLoop)}
requestAnimationFrame(fxLoop);
function fxUpdate(s){if(RM||!G)return;const now=performance.now();
  if(LEVEL==='hard'&&s.hour>=4){fxCont=true;const f=Math.min(1,(s.t-4*s.hourLen)/(2*s.hourLen));fxCount=Math.round(60+40*f);fxAlpha=.55+.25*f}
  else{fxCont=false;
    if(LEVEL!=='easy'&&now>nextRoll){nextRoll=now+10000;
      const near=['R3','R4','HALL'].includes(s.spPos)||s.info.sp!=='far';const ten=Math.max(s.music<30?1-s.music/30:0,near?1:0);
      const p=.15+.5*ten+(LEVEL==='hard'?.15:0);
      if(Math.random()<p&&now-lastBurst>6000)fxBurst(3+Math.random()*2,Math.round(25+Math.random()*15),LEVEL==='hard'?.6:.55)}}
  for(const e of s.events)if(e.type==='moved'&&LEVEL==='easy'&&now-lastBurst>45000)fxBurst(2,10,.25)}

  $('maskBtn').textContent=s.maskCd>0?'MÁSCARA (sin aire '+Math.ceil(s.maskCd)+'s)':(SMALL.matches?'MÁSCARA':'MÁSCARA (Espacio)');
  for(const k of ['L','R']){const side=k==='L'?'izq':'der';$('seal'+k).textContent=s.seal[k]>0?'Ducto '+side+' SELLADO':s.sealCd[k]>0?'Ducto '+side+' recarga '+Math.ceil(s.sealCd[k])+'s':'Sellar ducto'+(SMALL.matches?'':' '+side+' ('+(k==='L'?'Z':'X')+')');$('seal'+k).classList.toggle('on',s.seal[k]>0)}
  rb.classList.toggle('need',s.broken);$('resetBar').style.width=(s.reset_p*100)+'%';
  $('hallfig').classList.toggle('show',s.hall);if(s.hall)$('hallfig').innerHTML=svgSpr('spring','100%');
  $('faces').innerHTML=Object.entries(s.cams).map(([r,ids])=>ids.map((id,n)=>spr(id,ROOMS[r][0]+4+n*32,ROOMS[r][1]+18,2)).join('')).join('');
  for(const e of s.events){
    if(e.type==='laugh'){laugh(e.side);$('vent'+e.side).classList.remove('pulse');void $('vent'+e.side).offsetWidth;$('vent'+e.side).classList.add('pulse');msg('Risas en el ducto '+(e.side==='L'?'izquierdo':'derecho')+'… ¡Espacio!',2500)}
    if(e.type==='steps'){tone(70,.25,'triangle',0,.3);msg('Pasos en el pasillo… usa la linterna (Ctrl)')}
    if(e.type==='lure_broke')msg('El audio falló: reinícialo en el panel');
    if(e.type==='lure_fixed')msg('Audio restaurado');
    if(e.type==='light_fail')msg('La linterna falló');
    if(e.type==='flash'){tone(900,.15,'square',0,.2,200);msg('¡Destello! Spring-Freddy retrocedió')}
    if(e.type==='mask_scare'){tone(120,.3,'triangle',0,.2);msg('La máscara lo confundió: se fue del pasillo')}
    if(e.type==='mask_out'){setMask(false);msg('Sin aire: máscara fuera por 5 s')}
    if(e.type==='sealed')tone(150,.25,'square',e.side==='L'?-1:1,.15);
    if(e.type==='balloon_gone')msg('El muñeco se fue por el ducto');
    if(e.type==='sig'){tone(75,.35,'triangle',0,e.vol);tone(52,.35,'sine',0,e.vol);if(inp.monitor&&selCam===e.room)staticUntil=performance.now()+700}
    if(e.type==='lure_ok')msg('Spring-Freddy siguió el audio');
    if(e.type==='lure_ignored')msg('Spring-Freddy ignoró el audio');
    if(e.type==='music_warn')[660,560,480,420].forEach((f,i)=>setTimeout(()=>tone(f,.25,'sine',0,e.vol),i*260));
    if(e.type==='knock'){tone(80,.2,'square');msg('Spring-Freddy golpeó la puerta y se alejó')}
    if(e.type==='power_out'){tone(50,.8,'sawtooth');msg('Sin energía: las puertas se abrieron',4000)}
    if(e.type==='puppet_out'){tone(700,.4,'triangle',0,.15,300);msg('¡El Puppet salió! Dale cuerda a la caja (C)',3500)}
    if(e.type==='puppet_back')msg('El Puppet volvió a su caja');
    if(e.type==='balloon_in'){tone(300,.6,'sawtooth',0,.15,80);msg('El muñeco entró. La linterna ya no funciona.',4000)}
  }
  if(s.status==='dead')end(s);
}
function end(s){over=true;clearInterval(loop);setMask(false);setMonitor(false);
  if(s.status==='dead'){$('scare').className=s.by;$('scare').innerHTML=svgSpr(s.by,'75vmin');$('scare').style.display='flex';scareSound();
    setTimeout(()=>{$('scare').style.display='none';menu('<h1>Game Over</h1><p>'+(s.by==='puppet'?'La caja de música se apagó y el Puppet te atrapó.':NM[s.by]+' entró por la puerta abierta.')+'</p>')},1800)}
  }
function victory(){fxBurst(9,90,.85);menu('<div class="win6">6 AM</div><h1 class="big">Felicidades, has sobrevivido</h1>')}
function menu(h){$('screen').style.display='flex';$('screen').innerHTML=h+'<button onclick="start()">Reintentar</button><button onclick="home()">Menú</button>'}
function start(lv){fxReset();clearInterval(loop);paused=false;$('pause').style.display='none';LEVEL=lv||LEVEL;G={maskCd:0};if(PYF)PYF.start(LEVEL);inp.mask=false;inp.wind=false;inp.dlight=null;setMask(false);setMonitor(false);over=false;lure=null;$('screen').style.display='none';if(!start.h){hum();start.h=1}loop=setInterval(tick,100)}
const OLDINTRO=`<h1>Cinco Noches de Spring</h1>

function home(){$('screen').style.display='flex';$('screen').innerHTML=`<p class="tag">¿PUEDES SOBREVIVIR?</p><h1>Cinco Noches de Spring</h1><p>Sobrevive de 12 AM a 6 AM (6 minutos).</p><button onclick="tuto()">Tutorial</button><button onclick="start('easy')">Fácil</button><button onclick="start('mid')">Intermedio</button><button onclick="start('hard')">Difícil</button>`}
function tuto(){$('screen').innerHTML=`<h1>Tutorial</h1><div class="tut">
<p><b>Objetivo:</b> aguanta de 12 AM a 6 AM. Vigila la energía (puertas y luces), la caja de música y las cámaras.</p>
<p><b>Spring-Freddy:</b> avanza de sala en sala hasta el pasillo (ilumínalo con <b>Ctrl</b>). Si se queda 9 s, pasa a una puerta lateral: <b>ilumina la puerta</b> (Q / E, mantén) y <b>ciérrala</b> (A / D) rápido. Cada puerta cerrada gasta energía; si llega a 0 las puertas se abren.</p>
<p><b>Cómo espantarlo:</b> en cámaras haz clic en una sala adyacente para atraerlo con audio (30% de fallo; repara el panel manteniendo 4 s). Un destello de linterna de 2 s en el pasillo o 2 s con la máscara puesta lo hacen retroceder.</p>
<p><b>Muñeco de globos:</b> si oyes risas en un ducto, tienes 3 s para ponerte la máscara (Espacio) o sellar ese ducto (Z / X). Si entra, tu linterna muere y Spring-Freddy se acelera.</p>
<p><b>Bonnie, Toy Chica y Freddy:</b> avanzan por las salas hasta una puerta (Bonnie la izquierda, Toy Chica la derecha, Freddy cualquiera, y Freddy solo se mueve cuando NO miras las cámaras). Ilumina la puerta y ciérrala a tiempo. Fácil: Bonnie. Intermedio: Bonnie y Toy Chica. Difícil: los tres.</p>
<p>En las cámaras ves la cara de cada uno en la sala donde está. El Puppet duerme en el Taller y, si se apaga la caja, avanza por las salas. En el minimapa elige una sala para verla y pulsa ♪ para reproducir el audio allí.</p>
<p><b>Puppet:</b> mantén dada cuerda la caja de música (C, mantén). Si llega a 0, el Puppet sale: dale cuerda hasta 40% antes de que se acabe el tiempo.</p>
<p><b>Máscara:</b> dura 6 s y luego te deja sin aire 5 s. Con ella puesta ves dónde está Spring-Freddy y cuándo se va. El mapa de cámaras marca tu oficina con ● TÚ.</p>
<p><b>En celular o tablet:</b> usa los botones de la pantalla. Linterna pasillo, Iluminar puerta y Dar cuerda se mantienen presionados. Arrastra el dedo para mover la vista de la oficina. Juega en horizontal.</p>
<p><b>Mapa de ventilación:</b> en las cámaras, el botón «Mapa» cambia a los conductos del techo. Ahí ves a Balloon Boy en tiempo real y el ventilador por el que entrará.</p>\n<p><b>Consejos:</b> no dejes la linterna encendida de más; cierra la puerta solo cuando veas a Spring-Freddy; suelta la cuerda para vigilar si todo está tranquilo; en Difícil todo es más rápido.</p></div>
<button onclick="home()">Volver</button>`}
boot();
